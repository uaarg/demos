<!DOCTYPE html>
<html>
<head>
    <title>3D Point Cloud Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        canvas { display: block; }
        #overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            pointer-events: none; /* Let clicks pass through to Three.js */
        }
        #back-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            background: #444;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }
        #back-btn:hover { background: #666; }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
        }
        #capture-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #28a745;
            color: #fff;
            padding: 12px 24px;
            font-size: 18px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        #capture-btn:hover { background: #218838; }
    </style>
    <!-- Import maps polyfill -->
    <script async src="/static/js/es-module-shims.js"></script>

    <script type="importmap">
      {
        "imports": {
          "three": "/static/js/three.module.js",
          "three/addons/": "/static/js/"
        }
      }
    </script>
</head>
<body>
    <div id="overlay">
        <h2>OAK-D 3D Space</h2>
        <p>Left Click: Rotate</p>
        <p>Middle Click: Pan</p>
        <p>Scroll: Zoom</p>
        <p id="stats">Loading points...</p>
    </div>
    
    <div id="loading" style="display:none;">Loading Point Cloud Data...</div>
    <a href="/" id="back-btn">Back to 2D</a>
    <button id="capture-btn">Capture New 3D Scene</button>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Set up scene, camera, renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);

        // Increase 'far' clipping plane to 100,000 to prevent distant point clouds from disappearing
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 10, 100000);
        // Start from a slight angle to immediately perceive depth
        camera.position.set(0, 0, 1000);
        camera.lookAt(0, 0, 0); // Look at origin

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Add controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // smooth rotation
        controls.dampingFactor = 0.05;

        // Add coordinate axes helper for orientation (X=Red, Y=Green, Z=Blue)
        const axesHelper = new THREE.AxesHelper(1000);
        scene.add(axesHelper);

        let currentPointCloud = null;

        async function captureAndLoad() {
            document.getElementById('loading').innerText = "Capturing from OAK-D...";
            document.getElementById('loading').style.display = 'block';
            document.getElementById('capture-btn').disabled = true;

            try {
                // First, trigger a capture
                const captureRes = await fetch('/capture?id=' + Date.now().valueOf());
                if (!captureRes.ok) throw new Error("Capture failed");

                // Then load the point cloud
                await loadPointCloud();
            } catch (err) {
                document.getElementById('loading').innerText = err.message;
                console.error(err);
            } finally {
                document.getElementById('capture-btn').disabled = false;
            }
        }

        async function loadPointCloud(endpoint = null) {
            try {
                // Fetch the raw binary buffer
                document.getElementById('loading').innerText = "Downloading Point Cloud...";
                
                const fetchUrl = endpoint || '/pointcloud_data?id=' + Date.now().valueOf();
                const response = await fetch(fetchUrl);
                if (!response.ok) {
                    throw new Error("Failed to fetch point cloud (perhaps no image captured yet?)");
                }
                
                const buffer = await response.arrayBuffer();
                
                // Each point has 3 floats (12 bytes) + 3 uint8s (3 bytes) = 15 bytes total per point.
                // However, backend concatenation sends ALL floats first, then ALL uint8s.
                // Number of points = total bytes / 15
                const numPoints = buffer.byteLength / 15;
                
                document.getElementById('stats').innerText = `Loaded ${numPoints.toLocaleString()} points`;
                document.getElementById('loading').style.display = 'none';

                // First array segment: Float32 (XYZ)
                const positionOffset = 0;
                const positionByteLength = numPoints * 3 * 4; 
                const positions = new Float32Array(buffer, positionOffset, numPoints * 3);

                // Second array segment: Uint8 (RGB)
                const colorOffset = positionByteLength;
                const colors = new Uint8Array(buffer, colorOffset, numPoints * 3);

                // Build geometry
                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                // Set normalized=true because these are 0-255 uint8, but WebGL expects 0.0-1.0 floats
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3, true));

                // Since the OAK-D camera's Y axis faces down and Z axis faces forward, 
                // we'll apply a rotation/scale to make it feel natural in standard 3D space.
                geometry.scale(1, 1, -1);
                
                // Adjust geometry so it rotates around its center somewhat reasonably
                geometry.computeBoundingBox();
                const center = new THREE.Vector3();
                geometry.boundingBox.getCenter(center);
                geometry.translate(-center.x, -center.y, -center.z);
                
                controls.target.set(0, 0, 0);

                // Material settings
                const material = new THREE.PointsMaterial({
                    size: 3.0,       // Fix the size of points in screen-space pixels
                    vertexColors: true, 
                    sizeAttenuation: false // Don't let them shrink to 0 size at a distance
                });

                if (currentPointCloud) scene.remove(currentPointCloud);
                currentPointCloud = new THREE.Points(geometry, material);
                scene.add(currentPointCloud);

                // Move camera back to see the whole cloud
                const maxDim = Math.max(
                    geometry.boundingBox.max.x - geometry.boundingBox.min.x,
                    geometry.boundingBox.max.y - geometry.boundingBox.min.y,
                    geometry.boundingBox.max.z - geometry.boundingBox.min.z
                );
                
                // Fallback if maxDim goes wild
                const safeMaxDim = Math.min(maxDim, 15000);
                
                camera.position.z = safeMaxDim * 0.8;
                camera.position.y = safeMaxDim * 0.2;

            } catch (err) {
                document.getElementById('loading').innerText = err.message;
                console.error(err);
            }
        }

        // loadPointCloud(); // Don't auto-load in case they jumped straight here.
        document.getElementById('capture-btn').addEventListener('click', captureAndLoad);

        // Try to load any existing capture on page load, but don't show scary error if none
        const urlParams = new URLSearchParams(window.location.search);
        const logIdx = urlParams.get('log_idx');
        
        if (logIdx !== null) {
            document.getElementById('capture-btn').style.display = 'none'; // hide capture button for history logs
            loadPointCloud(`/api/logs/json/${logIdx}/pointcloud_data`).catch(e => {
                document.getElementById('loading').innerText = "Error loading history: " + e.message;
            });
        } else {
            loadPointCloud().catch(() => {
                document.getElementById('loading').style.display = 'none';
            });
        }

        // Handle window resizing
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // only required if controls.enableDamping or controls.autoRotate are set
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
