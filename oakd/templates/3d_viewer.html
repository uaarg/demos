<!DOCTYPE html>
<html>
<head>
    <title>3D Point Cloud Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        canvas { display: block; }
        #overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            pointer-events: none; /* Let clicks pass through to Three.js */
        }
        #back-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            background: #444;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }
        #back-btn:hover { background: #666; }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
        }
    </style>
    <!-- Import maps polyfill -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    <div id="overlay">
        <h2>OAK-D 3D Space</h2>
        <p>Left Click: Rotate</p>
        <p>Middle Click: Pan</p>
        <p>Scroll: Zoom</p>
        <p id="stats">Loading points...</p>
    </div>
    
    <div id="loading">Loading Point Cloud Data...</div>
    <a href="/" id="back-btn">Back to 2D</a>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Set up scene, camera, renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 100, 15000);
        // Start from a slight angle to immediately perceive depth
        camera.position.set(0, 0, -1000);
        camera.lookAt(0, 0, 500); // Look "forward" into the depth axis

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Add controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // smooth rotation
        controls.dampingFactor = 0.05;

        // Add coordinate axes helper for orientation (X=Red, Y=Green, Z=Blue)
        const axesHelper = new THREE.AxesHelper(1000);
        scene.add(axesHelper);

        async function loadPointCloud() {
            try {
                // Fetch the raw binary buffer
                const response = await fetch('/pointcloud_data?id=' + Date.now().valueOf());
                if (!response.ok) {
                    throw new Error("Failed to fetch point cloud (perhaps no image captured yet?)");
                }
                
                const buffer = await response.arrayBuffer();
                
                // Each point has 3 floats (12 bytes) + 3 uint8s (3 bytes) = 15 bytes total per point.
                // However, backend concatenation sends ALL floats first, then ALL uint8s.
                // Number of points = total bytes / 15
                const numPoints = buffer.byteLength / 15;
                
                document.getElementById('stats').innerText = `Loaded ${numPoints.toLocaleString()} points`;
                document.getElementById('loading').style.display = 'none';

                // First array segment: Float32 (XYZ)
                const positionOffset = 0;
                const positionByteLength = numPoints * 3 * 4; 
                const positions = new Float32Array(buffer, positionOffset, numPoints * 3);

                // Second array segment: Uint8 (RGB)
                const colorOffset = positionByteLength;
                const colors = new Uint8Array(buffer, colorOffset, numPoints * 3);

                // Build geometry
                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                // Set normalized=true because these are 0-255 uint8, but WebGL expects 0.0-1.0 floats
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3, true));

                // Since the OAK-D camera's Y axis faces down and Z axis faces forward, 
                // we'll apply a rotation/scale to make it feel natural in standard 3D space.
                geometry.scale(1, -1, 1);
                
                // Adjust geometry so it rotates around its center somewhat reasonably
                geometry.computeBoundingBox();
                const center = new THREE.Vector3();
                geometry.boundingBox.getCenter(center);
                geometry.translate(-center.x, -center.y, -center.z);
                
                controls.target.set(0, 0, 0);

                // Material settings
                const material = new THREE.PointsMaterial({
                    size: 8.0,       // Size of individual points in pixels
                    vertexColors: true, 
                    sizeAttenuation: true // Points further away appear smaller
                });

                const pointCloud = new THREE.Points(geometry, material);
                scene.add(pointCloud);

                // Move camera back to see the whole cloud
                const maxDim = Math.max(
                    geometry.boundingBox.max.x - geometry.boundingBox.min.x,
                    geometry.boundingBox.max.y - geometry.boundingBox.min.y,
                    geometry.boundingBox.max.z - geometry.boundingBox.min.z
                );
                camera.position.z = -maxDim * 0.8;
                camera.position.y = maxDim * 0.2;

            } catch (err) {
                document.getElementById('loading').innerText = err.message;
                console.error(err);
            }
        }

        loadPointCloud();

        // Handle window resizing
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // only required if controls.enableDamping or controls.autoRotate are set
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
